plugins { id 'com.android.application' }

android {
    namespace 'com.sukaengine.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.sukaengine.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.11.0"
        externalNativeBuild { cmake { cppFlags "-std=c++17" } }
    }

    externalNativeBuild {
        cmake { path "src/main/cpp/CMakeLists.txt" version "3.22.1" }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../projects', '../../assets']
        }
    }
}